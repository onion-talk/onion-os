[workspace]
members = ["."]
resolver = "2"

[package]
name = "onion-os"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["OnionTalk Project <security@oniontalk.co>"]
description = "OnionOS — Consolidated Sovereign Amnesic Tor & PQC Linux Workstation Core"

[lib]
name = "onion_os"
path = "src/lib.rs"

[[bin]]
name = "onion-os"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
