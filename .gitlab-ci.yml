stages:
  - validate
  - test
  - build
  - security
  - deploy

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C link-arg=-Wl,-z,noexecstack"

validate_manifests_and_scripts:
  stage: validate
  image:
    name: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    pull_policy: [if-not-present, always]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq && rm -rf /var/lib/apt/lists/*
  script:
    - sh -n entrypoint.sh
    - jq empty policies.json
    - jq empty seccomp-onionos.json
    - |
      if LC_ALL=C grep -q $'\r' entrypoint.sh; then
        echo "ERROR: CRLF detected in entrypoint.sh"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

rust_core_unit_tests:
  stage: test
  image:
    name: rust:slim-bookworm@sha256:86234e857a413004348b471d11a4ebe1aa92d2eae2b6b143cac68fd1ac3c48be
    pull_policy: [if-not-present, always]
  needs:
    - validate_manifests_and_scripts
  cache:
    key: "onionos-cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - core/target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config binutils cmake build-essential perl && rm -rf /var/lib/apt/lists/*
  script:
    - cargo check --manifest-path core/Cargo.toml --all-targets
    - cargo test --manifest-path core/Cargo.toml -- --nocapture
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

build_hardened_elf:
  stage: build
  image:
    name: rust:slim-bookworm@sha256:86234e857a413004348b471d11a4ebe1aa92d2eae2b6b143cac68fd1ac3c48be
    pull_policy: [if-not-present, always]
  needs:
    - rust_core_unit_tests
  cache:
    key: "onionos-cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - core/target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config binutils cmake build-essential perl && rm -rf /var/lib/apt/lists/*
  script:
    - cargo build --release --manifest-path core/Cargo.toml
    - strip --strip-all core/target/release/onion-os
    - ./core/target/release/onion-os --self-test
    - sha256sum core/target/release/onion-os > manifest.sha256
  artifacts:
    expire_in: 7 days
    paths:
      - core/target/release/onion-os
      - manifest.sha256
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

security_sovereign_invariants_gate:
  stage: security
  image:
    name: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    pull_policy: [if-not-present, always]
  needs:
    - build_hardened_elf
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq && rm -rf /var/lib/apt/lists/*
  script:
    - grep -q '"127.0.0.1:8430:8430"' docker-compose.yml
    - grep -q "image: eriktonon/onion-os:1.0.0" docker-compose.yml
    - grep -q "read_only: true" docker-compose.yml
    - grep -q "pids_limit: 2048" docker-compose.yml
    - grep -q "mem_limit: 2048m" docker-compose.yml
    - grep -q "memswap_limit: 2048m" docker-compose.yml
    - grep -q "no-new-privileges:true" docker-compose.yml
    - grep -q "ONIONOS_RELAY_BIND_PORT=8088" docker-compose.yml
    - grep -q "eriktonon/oniontalk-web:v1.8.1-build74@sha256:c8f81fe7475441e5e8c94a48204c03064b102dec1d726547761d62ac6968d735" Dockerfile
    - grep -q "eriktonon/oniontalk-relay-rs:1.8.1@sha256:8af6943f1ffde9a8ed9d4d1b9a85fe7890b187ad05f81785189e482b7d6ce670" Dockerfile
    - grep -q -- "--sport 8430" entrypoint.sh
    - grep -q -- "--uid-owner 10016 -j ACCEPT" entrypoint.sh
    - grep -q -- "--reuid=10015" entrypoint.sh
    - grep -q -- "--bounding-set=-all" entrypoint.sh
    - grep -q -- "--no-new-privs" entrypoint.sh
    - jq -e '.policies.BlockAboutConfig == true and .policies.Homepage.Locked == true and .policies.DNSOverHTTPS.Enabled == false' policies.json >/dev/null
    - jq -e '.policies.Proxy.SOCKSProxy == "127.0.0.1:9050" and .policies.Proxy.UseProxyForDNS == true' policies.json >/dev/null
    - jq -e '.policies.Preferences["media.peerconnection.enabled"].Value == false and .policies.Preferences["privacy.resistFingerprinting"].Value == true and .policies.Preferences["webgl.disabled"].Value == true' policies.json >/dev/null
    - |
      if [ -d core/static ] && grep -RInE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.jsdelivr|unpkg\.com|cdnjs\.cloudflare)' core/static/ >/dev/null 2>&1; then
        echo "CRITICAL: External CDN reference detected in core/static/"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

deploy_release_gate:
  stage: deploy
  image:
    name: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    pull_policy: [if-not-present, always]
  needs:
    - security_sovereign_invariants_gate
  when: manual
  script:
    - echo "OnionOS v1.0.0 consolidated sovereign artifact verified (SHA-256):"
    - cat manifest.sha256
    - echo "Ready for controlled OCI deployment: docker compose up -d --build"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
