name: OnionOS Sovereign CI & Docker Hub Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now -C link-arg=-Wl,-z,noexecstack"

jobs:
  validate-and-security:
    name: Validate Single-Container 3-UID Netfilter, Relay Pins & Zero-Leak Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate entrypoint.sh syntax & pure LF line endings
        run: |
          sh -n entrypoint.sh
          if LC_ALL=C grep -q $'\r' entrypoint.sh; then
            echo "ERROR: CRLF detected in entrypoint.sh"
            exit 1
          fi

      - name: Validate Docker Compose v2 & Sovereign v1.0.0 Invariants
        run: |
          docker compose config -q
          grep -q '"127.0.0.1:8430:8430"' docker-compose.yml
          grep -q "image: eriktonon/onion-os:1.0.0" docker-compose.yml
          grep -q "read_only: true" docker-compose.yml
          grep -q "pids_limit: 2048" docker-compose.yml
          grep -q "mem_limit: 2048m" docker-compose.yml
          grep -q "memswap_limit: 2048m" docker-compose.yml
          grep -q "ONIONOS_RELAY_BIND_PORT=8088" docker-compose.yml
          grep -q "eriktonon/oniontalk-web:v1.8.2-build75@sha256:fd1e8362472f40efb5bd63b1c51a94f66edd3c0d1b4978162fbf9ffb946c01e6" Dockerfile
          grep -q "eriktonon/oniontalk-relay-rs:1.8.2@sha256:a12c034159a32edc37a52d083471d274ccc22b293fb0aa921ef1e642a5f59054" Dockerfile
          grep -q -- "--sport 8430" entrypoint.sh
          grep -q -- "--uid-owner 10016 -j ACCEPT" entrypoint.sh
          grep -q -- "--reuid=10015" entrypoint.sh
          grep -q -- "--bounding-set=-all" entrypoint.sh
          grep -q -- "--no-new-privs" entrypoint.sh
          jq empty policies.json
          jq empty seccomp-onionos.json
          jq -e '.policies.BlockAboutConfig == true and .policies.Homepage.Locked == true and .policies.DNSOverHTTPS.Enabled == false' policies.json >/dev/null
          jq -e '.policies.Proxy.SOCKSProxy == "127.0.0.1:9050" and .policies.Proxy.UseProxyForDNS == true' policies.json >/dev/null
          if [ -d core/static ] && grep -RInE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.jsdelivr|unpkg\.com|cdnjs\.cloudflare)' core/static/; then
            echo "CRITICAL: External CDN reference detected in core/static/"
            exit 1
          fi

      - name: Audit OnionOS Rust Core Lockfile (core/Cargo.lock) Against OSV.dev
        run: |
          python3 - << 'PY'
          import json, os, pathlib, re, sys, urllib.request
          lock_path = pathlib.Path("core/Cargo.lock")
          if not lock_path.exists():
              print("[OSV-GATE] Missing core/Cargo.lock", file=sys.stderr)
              sys.exit(1)
          pkgs = list(dict.fromkeys(re.findall(r'\[\[package\]\]\s+name\s*=\s*"([^"]+)"\s+version\s*=\s*"([^"]+)"', lock_path.read_text("utf-8"))))
          if not pkgs:
              print("[OSV-GATE] 0 packages parsed from core/Cargo.lock", file=sys.stderr)
              sys.exit(1)
          if os.environ.get("STRIX_OFFLINE_AIRGAP") == "1":
              print(f"[OSV-GATE] STRIX_OFFLINE_AIRGAP=1 set; skipped {len(pkgs)} crates")
              sys.exit(0)
          cache, blocking = {}, []
          for i in range(0, len(pkgs), 500):
              chunk = pkgs[i:i+500]
              body = json.dumps({"queries": [{"package": {"name": n, "ecosystem": "crates.io"}, "version": v} for n, v in chunk]}).encode()
              req = urllib.request.Request("https://api.osv.dev/v1/querybatch", data=body, method="POST", headers={"Content-Type": "application/json", "User-Agent": "onionos-osv-gate/1.0"})
              resp = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
              for (n, v), r in zip(chunk, resp.get("results") or []):
                  for ve in r.get("vulns") or []:
                      vid = ve.get("id", "")
                      if vid not in cache:
                          cache[vid] = json.loads(urllib.request.urlopen(f"https://api.osv.dev/v1/vulns/{vid}", timeout=15).read().decode())
                      doc = cache[vid]
                      aliases = [str(a) for a in (doc.get("aliases") or [])]
                      has_cve = vid.startswith(("CVE-", "GHSA-")) or any(a.startswith(("CVE-", "GHSA-")) for a in aliases)
                      dbs_list = [(a.get("database_specific") or {}) for a in (doc.get("affected") or [])]
                      info_tags = {str(d["informational"]).lower() for d in dbs_list if d.get("informational")}
                      cats = {str(c).lower() for d in dbs_list for c in (d.get("categories") or [])}
                      has_cvss = any(bool(d.get("cvss")) for d in dbs_list)
                      slc = str(doc.get("summary") or "").lower()
                      if not has_cve and not doc.get("severity") and not has_cvss and not cats and (info_tags == {"unmaintained"} or (not info_tags and ("is unmaintained" in slc or "no longer maintained" in slc))):
                          continue
                      blocking.append(f"{n}@{v} -> {vid} ({','.join(aliases) or doc.get('summary', 'security-advisory')})")
          if blocking:
              for b in blocking:
                  print(f"[OSV-GATE] BLOCKED: {b}", file=sys.stderr)
              sys.exit(1)
          print(f"[OSV-GATE] PASS: {len(pkgs)} crates in core/Cargo.lock verified clean via OSV.dev")
          PY

  rust-core-test:
    name: Rust Core Build, Crypto, TOTP, QR, Relay & Forensics Self-Test
    runs-on: ubuntu-latest
    needs: validate-and-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts (Zero Target Build-Dir Cache)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo check & test suite
        run: |
          cargo check --manifest-path core/Cargo.toml --all-targets
          cargo test --manifest-path core/Cargo.toml -- --nocapture

      - name: Build release binary & execute cryptographic self-test
        run: |
          cargo build --release --manifest-path core/Cargo.toml
          strip --strip-all core/target/release/onion-os
          ./core/target/release/onion-os --self-test

  container-build:
    name: Consolidated Multi-Stage Container Build & Docker Hub Release Gate
    runs-on: ubuntu-latest
    needs: rust-core-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build consolidated onion-os image & run self-test
        run: |
          docker compose build onion-os
          docker run --rm --entrypoint /usr/local/bin/onion-os eriktonon/onion-os:1.0.0 --self-test

      - name: Audit Consolidated Debian:12 Container Image (/var/lib/dpkg/status) Against OSV.dev
        run: |
          docker run --rm --entrypoint /bin/cat eriktonon/onion-os:1.0.0 /var/lib/dpkg/status > /tmp/onionos_dpkg_status.txt
          python3 - << 'PY'
          import concurrent.futures, json, pathlib, re, sys, time, urllib.request

          def char_order(ch):
              if ch == "~": return -1
              if ch is None: return 0
              return ord(ch) if ch.isalpha() else ord(ch) + 256

          def verrevcmp(a, b):
              i, j, la, lb = 0, 0, len(a), len(b)
              while i < la or j < lb:
                  while (i < la and not a[i].isdigit()) or (j < lb and not b[j].isdigit()):
                      ca = a[i] if (i < la and not a[i].isdigit()) else None
                      cb = b[j] if (j < lb and not b[j].isdigit()) else None
                      oa, ob = char_order(ca), char_order(cb)
                      if oa != ob: return -1 if oa < ob else 1
                      if ca is not None: i += 1
                      if cb is not None: j += 1
                  ia = i
                  while i < la and a[i].isdigit(): i += 1
                  jb = j
                  while j < lb and b[j].isdigit(): j += 1
                  na = int(a[ia:i]) if ia < i else 0
                  nb = int(b[jb:j]) if jb < j else 0
                  if na != nb: return -1 if na < nb else 1
              return 0

          def deb_ver_cmp(v1, v2):
              e1, r1 = (int(v1.split(":", 1)[0]), v1.split(":", 1)[1]) if ":" in v1 else (0, v1)
              e2, r2 = (int(v2.split(":", 1)[0]), v2.split(":", 1)[1]) if ":" in v2 else (0, v2)
              if e1 != e2: return -1 if e1 < e2 else 1
              u1, d1 = r1.rsplit("-", 1) if "-" in r1 else (r1, "")
              u2, d2 = r2.rsplit("-", 1) if "-" in r2 else (r2, "")
              c = verrevcmp(u1, u2)
              return c if c != 0 else verrevcmp(d1, d2)

          st = pathlib.Path("/tmp/onionos_dpkg_status.txt").read_text(encoding="utf-8", errors="replace")
          sources = {}
          for stanza in st.split("\n\n"):
              if "Status: install ok installed" not in stanza: continue
              pm = re.search(r"^Package:\s*(\S+)", stanza, re.M)
              vm = re.search(r"^Version:\s*(\S+)", stanza, re.M)
              sm = re.search(r"^Source:\s*(\S+)(?:\s*\(([^)]+)\))?", stanza, re.M)
              if not pm or not vm: continue
              src_name = sm.group(1) if sm else pm.group(1)
              src_ver = sm.group(2) if (sm and sm.group(2)) else re.sub(r"\+b\d+$", "", vm.group(1))
              sources[src_name] = src_ver

          for req_pkg in ("firefox-esr", "tor", "x11vnc", "openssl", "zlib"):
              if req_pkg not in sources:
                  print(f"[ONIONOS-DPKG-OSV] ERROR: Expected runtime package '{req_pkg}' missing from dpkg status!", file=sys.stderr)
                  sys.exit(1)

          pkgs = sorted(sources.items())
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=json.dumps({"queries": [{"package": {"name": n, "ecosystem": "Debian:12"}, "version": v} for n, v in pkgs]}).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "onionos-dpkg-osv-gate/1.0"},
          )
          results = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())["results"]
          unique_vids = sorted({ve["id"] for r in results for ve in (r.get("vulns") or []) if ve.get("id")})

          def fetch_one(vid):
              for attempt in range(3):
                  try:
                      r = urllib.request.Request(f"https://api.osv.dev/v1/vulns/{vid}", headers={"User-Agent": "onionos-dpkg-osv-gate/1.0"})
                      with urllib.request.urlopen(r, timeout=15) as resp:
                          return vid, json.loads(resp.read().decode())
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(0.5 + attempt)

          cache = {}
          if unique_vids:
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                  for vid, doc in pool.map(fetch_one, unique_vids):
                      cache[vid] = doc

          blocking = []
          for (src_name, inst_ver), r in zip(pkgs, results):
              for ve in r.get("vulns") or []:
                  doc = cache.get(ve.get("id", "")) or {}
                  for aff in doc.get("affected") or []:
                      apkg = aff.get("package") or {}
                      if apkg.get("ecosystem") == "Debian:12" and apkg.get("name") == src_name:
                          for rng in aff.get("ranges") or []:
                              for ev in rng.get("events") or []:
                                  fx = str(ev.get("fixed") or "").strip()
                                  if fx and fx != "0" and deb_ver_cmp(inst_ver, fx) < 0:
                                      blocking.append(f"{src_name}@{inst_ver} < fixed {fx} ({ve['id']})")

          if blocking:
              for b in blocking:
                  print(f"[ONIONOS-DPKG-OSV] BLOCKED: {b}", file=sys.stderr)
              sys.exit(1)
          print(f"[ONIONOS-DPKG-OSV] PASS: {len(pkgs)} Debian:12 packages verified clean against OSV.dev (0 unpatched DSAs/CVEs).")
          PY

      - name: Push Verified Image to Docker Hub (On Release Tags v* When Secrets Configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: Invalid semver tag format: $RELEASE_TAG"
            exit 1
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s\n' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag eriktonon/onion-os:1.0.0 "eriktonon/onion-os:${RELEASE_TAG}"
            docker tag eriktonon/onion-os:1.0.0 "eriktonon/onion-os:v${RELEASE_TAG}"
            docker tag eriktonon/onion-os:1.0.0 "eriktonon/onion-os:latest"
            docker push "eriktonon/onion-os:${RELEASE_TAG}"
            docker push "eriktonon/onion-os:v${RELEASE_TAG}"
            docker push "eriktonon/onion-os:latest"
            echo "[OK] Published verified eriktonon/onion-os:${RELEASE_TAG} & :latest to Docker Hub."
          else
            echo "[INFO] DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not configured yet; skipping push."
          fi
